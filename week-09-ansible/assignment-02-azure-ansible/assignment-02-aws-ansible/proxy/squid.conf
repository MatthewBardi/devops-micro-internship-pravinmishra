
# Squid proxy for Week 09 Ansible training

# Listen on the default Squid proxy port
http_port 3128

# Permit only the private database subnet
acl database_subnet src 10.20.2.0/24

# Restrict requests to supported HTTP methods and safe ports
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow database_subnet
http_access deny all

# Do not cache downloaded packages
cache deny all

# Do not expose Squid's software version
httpd_suppress_version_string on
