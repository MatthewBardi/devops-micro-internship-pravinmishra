---
repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ansible/ansible-lint.git
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - ansible==14.5.0
